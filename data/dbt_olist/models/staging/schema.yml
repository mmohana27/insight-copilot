version: 2

models:
  - name: stg_orders
    description: "One row per order, with proper data types."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: order_status
        tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable',
                       'invoiced', 'processing', 'created', 'approved']

  - name: stg_customers
    description: "One row per customer_id (one per order). customer_unique_id identifies the real person."
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: state
        tests: [not_null]

  - name: stg_order_items
    description: "One row per item in an order."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: price
        tests: [not_null]

  - name: stg_order_payments
    description: "One row per payment on an order."
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_type
        tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

  - name: stg_order_reviews
    description: "One row per customer review."
    columns:
      - name: order_id
        tests: [not_null]
      - name: review_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: stg_products
    description: "One row per product."
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_sellers
    description: "One row per seller."
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: stg_product_category_translation
    description: "Portuguese to English category names."
    columns:
      - name: category_name
        tests: [unique, not_null]